<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sobics</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../javascript/jquery-3.4.1.min.js"></script>
    <script src="../javascript/script.js"></script>

</head>
<body>

<div id="gamearea"></div>
<div id="notgame">
<p>Your score: <span id="my_score">0</span></p>
<p>
    You can move with the arrow keys to the left and to the right.<br>
    You can pick up planets with the Space button.<br>
    You can put them back up with the Enter button.<br>
    The sun can't be picked up and the asteroid will clear the whole column.
</p>
<audio  controls>
    <source src="../audio/music.mp3" type =audio/mp3>
</audio>
<button id="score_board">Score Board</button>
<div id="top_list">
    <h3>Top ten players</h3>
    <p id="list"></p>
</div>
</div>
</body>
</html>
